[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.26"
remappings = [
    "forge-std/=lib/forge-std/src/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "chainlink/contracts/=lib/chainlink-evm/contracts/"
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
